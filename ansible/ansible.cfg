# ---------------------------------------------------------------------------
# Ansible configuration for this repository.
#
# Relative paths below are resolved against the *current working directory*,
# not against this file, so every command in the runbook starts with
# `cd ansible`. ANSIBLE_CONFIG=/path/to/ansible/ansible.cfg works too.
# ---------------------------------------------------------------------------

[defaults]
inventory              = ./inventory/aws_ec2.yml
roles_path             = ./roles
collections_path       = ./.collections:~/.ansible/collections:/usr/share/ansible/collections

# The instance is created from an AMI whose host key nobody has seen before, so
# strict checking would prompt on first contact and hang an unattended run.
# Accept-new records the key on first connection and fails if it later changes,
# which is the useful half of the check.
host_key_checking      = True

interpreter_python     = auto_silent

# YAML-formatted results: the multi-line diffs a --check run produces are
# unreadable as JSON. Set through result_format, not the old community.general
# "yaml" stdout callback, which was removed in community.general 12.
stdout_callback        = ansible.builtin.default
result_format          = yaml
callbacks_enabled      = ansible.posix.profile_tasks
retry_files_enabled    = False
forks                  = 10
timeout                = 30

# Uncomment once something is actually encrypted with ansible-vault. Pointing
# at a file that does not exist makes every play fail, so it stays off by
# default -- secrets come from Secrets Manager (group_vars/all/main.yml).
# vault_password_file  = ./.vault-pass

[inventory]
enable_plugins         = amazon.aws.aws_ec2, auto, yaml, ini
cache                  = False

[ssh_connection]
ssh_args               = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining             = True

[privilege_escalation]
become                 = True
become_method          = ansible.builtin.sudo
become_user            = root
