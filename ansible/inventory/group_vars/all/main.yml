---
# ---------------------------------------------------------------------------
# Site-wide variables. Nothing secret is allowed in this file -- it is
# committed. Secrets are read at run time from AWS Secrets Manager (the same
# secret Terraform creates empty), or from an ansible-vault file if you opt out
# of AWS. See vault.yml.example next to this file.
#
# group_vars lives INSIDE inventory/ deliberately. Ansible resolves group_vars
# relative to the inventory source and to the playbook's own directory -- with
# the playbooks in playbooks/, a top-level ansible/group_vars/ would silently
# never load and every variable below would fall back to a role default.
# ---------------------------------------------------------------------------

project: fastapi-react

# ---------------------------------------------------------------------------
# Connection
#
# terraform/environments/dev/terraform.tfvars ships with ssh_allowed_cidrs = []
# and key_name = null, i.e. SSH is CLOSED and access is via SSM Session Manager.
# Ansible therefore needs one of these two, and neither is free:
#
#   A. SSH  -- set both in terraform.tfvars and re-apply:
#        key_name          = "your-keypair"
#        ssh_allowed_cidrs = ["$(curl -s https://checkip.amazonaws.com)/32"]
#      Then leave the settings below as they are.
#
#   B. SSM  -- no open port, but the community.aws.aws_ssm connection plugin
#      needs an S3 bucket for file transfer and an instance-role policy that
#      allows reading and writing it (the current role has SSM core, ECR read
#      and two secrets -- not S3). Install the session-manager-plugin on the
#      controller, create the bucket, then uncomment:
#        ansible_connection: community.aws.aws_ssm
#        ansible_aws_ssm_bucket_name: <your-transfer-bucket>
#        ansible_aws_ssm_region: "{{ aws_region }}"
ansible_user: ubuntu

# ---------------------------------------------------------------------------
# Where the application lives on the box
#
# Matches terraform/modules/compute/variables.tf: app_directory defaults to
# /opt/app and the systemd unit is named "<project>-<environment>".
# ---------------------------------------------------------------------------

app_dir: /opt/app
app_service_name: "{{ project }}-{{ app_environment }}"

# A dedicated service account owns the application, per ARCHITECTURE.md §14.5.
# Terraform's first-boot script left /opt/app owned by `ubuntu`; the app role
# converges it to this user, which is the point of handing the box to Ansible.
#
# Note that membership of the `docker` group is effectively root on this host.
# It is the normal trade-off for a single-purpose app server -- on a shared host
# you would use rootless Docker or a sudo-gated wrapper instead.
app_user: deploy
app_group: deploy

# Compose files are copied from this repository, not fetched on the box. The
# instance's first-boot clone is a bootstrap convenience; once Ansible manages
# the host, the controller's checkout is the source of truth.
repo_root: "{{ playbook_dir }}/../.."

app_compose_files:
  - docker-compose.yml
  - docker-compose.prod.yml

# docker-compose.override.yml is development-only: it bind-mounts source trees
# that do not exist on the server and swaps in a webpack dev server. `docker
# compose` picks it up automatically if present, so the app role deletes it.

# ---------------------------------------------------------------------------
# Secrets
#
#   aws_secretsmanager  read on the instance, using its IAM role. No AWS
#                       credentials on the controller, no ciphertext in git.
#   vault               ansible-vault encrypted values in
#                       group_vars/all/vault.yml. Use only where the box has no
#                       AWS identity -- it puts ciphertext in git and requires
#                       distributing a vault password.
# ---------------------------------------------------------------------------

app_secret_source: aws_secretsmanager

# The secret NAME, not its ARN: terraform/environments/dev/main.tf names it
# "${var.project}/${var.environment}/app", so it is derivable and carries no
# account ID. get-secret-value accepts a name for a secret in the same account.
app_secret_id: "{{ project }}/{{ app_environment }}/app"
