---
# ---------------------------------------------------------------------------
# Secrets are read here, once per run, and go straight into the .env template.
# They are never written to a fact file, a log, or this repository.
#
# The AWS calls run ON THE INSTANCE, using the IAM role attached by
# terraform/modules/compute/main.tf, which allows GetSecretValue on exactly two
# secret ARNs and kms:Decrypt only via Secrets Manager. That is deliberate: an
# Ansible `lookup()` would execute on the controller instead and would need AWS
# credentials on whoever's laptop is running the play.
#
# check_mode: false on every task here -- they are reads with no side effects,
# and running them during `--check` is what makes the dry run show a real diff
# of .env rather than an undefined-variable failure.
# ---------------------------------------------------------------------------

- name: Read the application secret from Secrets Manager
  when: app_secret_source == 'aws_secretsmanager'
  block:
    - name: Fetch the application secret
      ansible.builtin.command:
        argv:
          - /usr/local/bin/aws
          - secretsmanager
          - get-secret-value
          - --secret-id
          - "{{ app_secret_id }}"
          - --region
          - "{{ aws_region }}"
          - --query
          - SecretString
          - --output
          - text
      register: app_secret_raw
      changed_when: false
      check_mode: false
      no_log: true

    - name: Parse the application secret
      ansible.builtin.set_fact:
        app_secret: "{{ app_secret_raw.stdout | from_json }}"
      no_log: true

    - name: Check the application secret has usable values
      ansible.builtin.assert:
        that:
          - app_secret.SECRET_KEY is defined
          - app_secret.SECRET_KEY | length >= 32
          - app_secret.SECRET_KEY != 'change_this'
          - app_use_rds or app_secret.POSTGRES_PASSWORD is defined
        fail_msg: >-
          {{ app_secret_id }} does not hold a usable SECRET_KEY. Terraform
          creates the secret empty on purpose, so the value never enters
          Terraform state -- it is set once, out of band. The exact command,
          with the generated values, is a Terraform output:
          `terraform -chdir=../terraform/environments/{{ app_environment }}
          output -raw set_app_secret_command`
        quiet: true

    - name: Fetch the RDS master password
      ansible.builtin.command:
        argv:
          - /usr/local/bin/aws
          - secretsmanager
          - get-secret-value
          - --secret-id
          - "{{ db_secret_arn }}"
          - --region
          - "{{ aws_region }}"
          - --query
          - SecretString
          - --output
          - text
      register: app_db_secret_raw
      changed_when: false
      check_mode: false
      no_log: true
      when: app_use_rds

    - name: Select the database password
      ansible.builtin.set_fact:
        # RDS owns and rotates its master secret, so its password is the
        # authority when RDS is in use; the postgres container's password comes
        # from the application secret instead.
        app_db_password: >-
          {{ (app_db_secret_raw.stdout | from_json).password
             if app_use_rds else app_secret.POSTGRES_PASSWORD }}
        app_env_secret_key: "{{ app_secret.SECRET_KEY }}"
      no_log: true

- name: Take secrets from ansible-vault
  when: app_secret_source == 'vault'
  block:
    - name: Check the vault variables are present
      ansible.builtin.assert:
        that:
          - vault_secret_key is defined
          - vault_postgres_password is defined
        fail_msg: >-
          app_secret_source is "vault" but inventory/group_vars/all/vault.yml is missing
          or was not decrypted. See inventory/group_vars/all/vault.yml.example, and pass
          --ask-vault-pass (or set vault_password_file in ansible.cfg).
        quiet: true

    - name: Select the vaulted secrets
      ansible.builtin.set_fact:
        app_env_secret_key: "{{ vault_secret_key }}"
        app_db_password: "{{ vault_postgres_password }}"
      no_log: true

# --- registry ---------------------------------------------------------------
#
# The ECR registry hostname contains the account ID. Rather than committing one
# to this repository, ask the instance which account it is in -- the same thing
# terraform/modules/ecr/main.tf does with data.aws_caller_identity.

- name: Look up the AWS account ID
  ansible.builtin.command:
    argv:
      - /usr/local/bin/aws
      - sts
      - get-caller-identity
      - --query
      - Account
      - --output
      - text
  register: app_account_id
  changed_when: false
  check_mode: false
  when: app_registry_prefix | length == 0

- name: Compose the registry prefix
  ansible.builtin.set_fact:
    app_registry_prefix: "{{ reg_host }}/{{ project }}-{{ app_environment }}"
  vars:
    reg_host: "{{ app_account_id.stdout | trim }}.dkr.ecr.{{ aws_region }}.amazonaws.com"
  when: app_registry_prefix | length == 0
