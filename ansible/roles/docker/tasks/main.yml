---
# ---------------------------------------------------------------------------
# Docker Engine and the Compose v2 plugin.
#
# Installing Docker is the classic idempotency trap: most guides pipe
# get.docker.com into a shell (unpinned, reports changed every run) or use the
# deprecated apt_key module. Every step below is a module with a declared end
# state, so a second run is a no-op.
# ---------------------------------------------------------------------------

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: "{{ docker_apt_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker]

- name: Add the Docker apt signing key
  ansible.builtin.get_url:      # re-downloads only if the file differs
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
  tags: [docker]

# deb822 format, not the one-line `deb [...]` form: ansible.builtin.apt_repository
# is deprecated and disappears in ansible-core 2.25.
- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: [stable]
    architectures: "{{ docker_apt_arch }}"
    signed_by: "{{ docker_apt_keyring }}"
    state: present
    enabled: true
  tags: [docker]

# Terraform's first-boot script wrote the same repository in the old one-line
# format. Left in place it is a duplicate source, and apt says so on every
# update. This is the kind of drift Ansible exists to converge.
- name: Remove the first-boot repository definition
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/docker.gpg
  tags: [docker]

# update_cache without cache_valid_time: the repository above may have just
# been added, and a cache refreshed by the common role minutes ago would not
# have it.
- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  tags: [docker, packages]

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: "python3 -c \"import json,sys; json.load(open(sys.argv[1]))\" %s"
  notify: Restart docker
  tags: [docker]

# `enabled: true` is half of "the application survives a reboot": compose's
# restart policy only takes effect if dockerd itself comes back.
- name: Ensure Docker is running and starts on boot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  tags: [docker]

- name: Add accounts to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | unique }}"
  tags: [docker]
