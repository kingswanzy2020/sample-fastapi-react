---
# apt wants Debian architecture names; Ansible reports the kernel's.
docker_arch_map:
  x86_64: amd64
  aarch64: arm64
docker_apt_arch: "{{ docker_arch_map[ansible_facts.architecture] | default('amd64') }}"

docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_keyring: /etc/apt/keyrings/docker.asc

# docker-compose-plugin, not the standalone docker-compose binary: v1 is
# end-of-life and `docker compose` (the v2 subcommand) is what the deploy
# tasks, the systemd unit and community.docker.docker_compose_v2 all call.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Without a cap, one chatty container fills the root volume and the failure
# presents as a mysterious application outage. Same values as the daemon.json
# written by terraform/modules/compute/user_data.sh.tftpl.
docker_log_max_size: 10m
docker_log_max_file: "3"

# The login account, so a human debugging over SSH can run `docker compose ps`
# without sudo. The service account is added to the group by the app role,
# which is also what creates it -- the docker group has to exist first, which
# is why the roles run in this order.
docker_users:
  - "{{ ansible_user }}"
