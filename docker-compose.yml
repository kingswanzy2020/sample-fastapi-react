services:
  frontend:
    build:
      context: frontend
      target: production
    image: ${REGISTRY:-fastapi-react}/frontend:${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: backend
    image: ${REGISTRY:-fastapi-react}/backend:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${REGISTRY:-fastapi-react}/backend:${IMAGE_TAG:-latest}
    command: celery --app app.tasks worker --loglevel=INFO -Q main-queue -c 2
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: ${REGISTRY:-fastapi-react}/backend:${IMAGE_TAG:-latest}
    command: alembic upgrade head
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
