{{- /*
EKS: materialise the app Secret from AWS Secrets Manager.

The SecretStore has no auth block on purpose: the operator then uses its own
credentials, which are an IRSA role scoped to exactly these two secrets
(terraform/environments/dev-k8s/cluster). No AWS keys exist in the cluster.

The template builds DATABASE_URL from the RDS-managed secret, so the resolved
connection string exists only inside the cluster -- never in git, Helm values
or Terraform state. The inner {{ }} are for the operator's template engine,
not Helm, hence the backtick strings.
*/ -}}
{{- if .Values.externalSecret.enabled }}
{{- $appSecret := required "externalSecret.appSecretName is required" .Values.externalSecret.appSecretName }}
{{- $dbSecret := required "externalSecret.dbSecretName is required (terraform output helm_set_flags)" .Values.externalSecret.dbSecretName }}
{{- $dbHost := required "database.host is required when postgresql.enabled=false (terraform output helm_set_flags)" .Values.database.host }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "fastapi-react.fullname" . }}-aws
  labels:
    {{- include "fastapi-react.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fastapi-react.fullname" . }}-secrets
  labels:
    {{- include "fastapi-react.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "fastapi-react.fullname" . }}-aws
  target:
    name: {{ include "fastapi-react.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: {{ `"{{ .secretKey }}"` }}
        DATABASE_URL: {{ printf `"postgresql://{{ .dbUser }}:{{ .dbPassword | urlquery }}@%s:%d/%s"` $dbHost (int .Values.database.port) .Values.database.name }}
  data:
    - secretKey: secretKey
      remoteRef:
        key: {{ $appSecret }}
        property: SECRET_KEY
    - secretKey: dbUser
      remoteRef:
        key: {{ $dbSecret }}
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: {{ $dbSecret }}
        property: password
{{- end }}
