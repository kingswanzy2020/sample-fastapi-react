{{- /*
Local-cluster secrets, rendered from values supplied at deploy time
(deploy/kind/secrets.local.yaml, gitignored). On EKS externalsecret.yaml owns
this Secret instead.

Empty values are skipped, not rendered as "" -- see the note on `secrets` in
values.yaml.
*/ -}}
{{- if not .Values.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastapi-react.fullname" . }}-secrets
  labels:
    {{- include "fastapi-react.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.SECRET_KEY }}
  SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  {{- $password := required "secrets.POSTGRES_PASSWORD is required: run scripts/k8s/deploy-local.sh, which generates deploy/kind/secrets.local.yaml" .Values.secrets.POSTGRES_PASSWORD }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres:5432/%s" .Values.postgresql.user (urlquery $password) .Values.postgresql.database | quote }}
  {{- end }}
{{- end }}
